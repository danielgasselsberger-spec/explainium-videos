<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Mont;src:url(mont.ttf);font-weight:100 900}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body>
<canvas id="out" width="1080" height="1920"></canvas>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

await document.fonts.load('900 80px Mont');
const W=1080,H=1920;
const out=document.getElementById('out'); const octx=out.getContext('2d');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H,false); renderer.setPixelRatio(1);
renderer.outputColorSpace=THREE.SRGBColorSpace;
const camera=new THREE.PerspectiveCamera(42,W/H,0.1,400);

// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,t)=>{const x=clamp((t-a)/(b-a));return x*x*(3-2*x);};
const eob=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const pop=(t,t0,d=0.45)=>t<t0?0:eob((t-t0)/d);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646;};}

const grad=(()=>{const d=new Uint8Array([70,70,70,255,160,160,160,255,255,255,255,255]);
  const t=new THREE.DataTexture(d,3,1,THREE.RGBAFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t;})();
const outlineMat=new THREE.MeshBasicMaterial({color:0x1b1420,side:THREE.BackSide});
function toon(color,opts={}){return new THREE.MeshToonMaterial({color,gradientMap:grad,...opts});}
function mesh(geom,color,{outline=0.035,mat=null,parent=null}={}){
  const m=new THREE.Mesh(geom,mat||toon(color));
  if(outline){const o=new THREE.Mesh(geom,outlineMat);o.scale.setScalar(1+outline);
    // scale around own center for offset geoms
    m.add(o);}
  if(parent)parent.add(m);
  return m;
}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;}
function label(text,{w=512,h=256,font='900 120px Mont',color='#fff',bg=null,stroke='#1b1420',sw=14,radius=40,size=1}={}){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
  const draw=(txt)=>{x.clearRect(0,0,w,h);
    if(bg){x.fillStyle=bg;x.strokeStyle=stroke;x.lineWidth=sw;x.beginPath();x.roundRect(sw,sw,w-2*sw,h-2*sw,radius);x.fill();x.stroke();}
    x.font=font;x.textAlign='center';x.textBaseline='middle';
    if(!bg&&stroke){x.lineWidth=sw;x.strokeStyle=stroke;x.lineJoin='round';x.strokeText(txt,w/2,h/2+6);}
    x.fillStyle=color;x.fillText(txt,w/2,h/2+6);tex.needsUpdate=true;};
  draw(text);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(size*w/h,size),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false}));
  m.userData.set=(t)=>{if(m.userData.cur!==t){m.userData.cur=t;draw(t);}};m.userData.cur=text;
  return m;
}
function blob(r=0.7,parent){const m=new THREE.Mesh(new THREE.CircleGeometry(r,32),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.22,depthWrite:false}));
  m.rotation.x=-Math.PI/2;m.position.y=0.01;if(parent)parent.add(m);return m;}

// ---------- cheese wheel ----------
const rindTex=canvasTex(1024,256,(x,w,h)=>{x.fillStyle='#e9b54f';x.fillRect(0,0,w,h);
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(120,70,10,.25)');g.addColorStop(.5,'rgba(255,230,150,.15)');g.addColorStop(1,'rgba(120,70,10,.25)');x.fillStyle=g;x.fillRect(0,0,w,h);
  x.fillStyle='rgba(140,85,20,.75)';x.font='900 34px Mont';x.textBaseline='middle';
  const s='PARMIGIANO REGGIANO • ';let px=0;for(let r=0;r<2;r++){px=r*90;while(px<w){for(const ch of s){x.fillText(ch,px,h*(r?0.66:0.34));px+=x.measureText(ch).width+4;}}}
});
rindTex.wrapS=THREE.RepeatWrapping;
const capTex=canvasTex(512,512,(x,w,h)=>{const g=x.createRadialGradient(w/2,h/2,10,w/2,h/2,w/2);g.addColorStop(0,'#f3cf74');g.addColorStop(.85,'#e7b24c');g.addColorStop(1,'#c98d2c');
  x.fillStyle=g;x.fillRect(0,0,w,h);x.strokeStyle='rgba(150,90,20,.5)';x.lineWidth=6;x.beginPath();x.arc(w/2,h/2,150,0,7);x.stroke();
  x.fillStyle='rgba(150,90,20,.6)';x.font='900 44px Mont';x.textAlign='center';x.textBaseline='middle';x.fillText('DOP',w/2,h/2);});
const wheelProfile=[];{const R=1,Hh=0.42;for(let i=0;i<=16;i++){const a=i/16;const y=lerp(-Hh,Hh,a);const bulge=0.07*Math.sin(Math.PI*a);wheelProfile.push(new THREE.Vector2(R-0.05+bulge,y));}}
const wheelSide=new THREE.LatheGeometry(wheelProfile,64);
const wheelCap=new THREE.CircleGeometry(0.95,64);
function cheese({outline=true}={}){
  const g=new THREE.Group();
  const sideMat=toon(0xffffff,{map:rindTex});const capMat=toon(0xffffff,{map:capTex});
  const s=mesh(wheelSide,0,{mat:sideMat,outline:outline?0.04:0});g.add(s);
  const t=new THREE.Mesh(wheelCap,capMat);t.rotation.x=-Math.PI/2;t.position.y=0.42;g.add(t);
  const b=new THREE.Mesh(wheelCap,capMat);b.rotation.x=Math.PI/2;b.position.y=-0.42;g.add(b);
  if(outline){const o=new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.0,0.9,48),outlineMat);o.scale.set(1.04,1.04,1.04);g.add(o);}
  g.userData.mats=[sideMat,capMat];
  return g;
}

// ---------- characters ----------
function person({suit=0x3d6fb6,skin=0xf2c097,pants=0x3a3a4a,hat=null,apron=false,tie=null,mustache=0x4a2c1a,glasses=false,hair=0x4a2c1a}){
  const g=new THREE.Group(); const r={};
  const legG=new THREE.CapsuleGeometry(0.16,0.45,6,12);
  for(const s of[-1,1]){const p=new THREE.Group();p.position.set(0.22*s,0.78,0);const l=mesh(legG,pants);l.position.y=-0.36;p.add(l);
    const shoe=mesh(new THREE.SphereGeometry(0.2,16,12),0x2a1d18);shoe.scale.set(1,0.6,1.4);shoe.position.set(0,-0.68,0.08);p.add(shoe);g.add(p);r[s<0?'legL':'legR']=p;}
  const body=mesh(new THREE.CapsuleGeometry(0.52,0.55,8,20),suit);body.position.y=1.3;g.add(body);r.body=body;
  if(apron){const a=mesh(new THREE.CylinderGeometry(0.535,0.56,0.8,24,1,true,-1.1,2.2),0xffffff,{outline:0});a.position.y=1.15;a.material.side=THREE.DoubleSide;g.add(a);}
  if(tie){const t=mesh(new THREE.ConeGeometry(0.1,0.5,4),tie,{outline:0.06});t.rotation.x=Math.PI;t.position.set(0,1.55,0.5);t.rotation.x=Math.PI-0.15;g.add(t);
    const sh=mesh(new THREE.BoxGeometry(0.34,0.5,0.1),0xffffff,{outline:0});sh.position.set(0,1.6,0.44);sh.rotation.x=-0.15;g.add(sh);}
  const armG=new THREE.CapsuleGeometry(0.13,0.55,6,12);
  for(const s of[-1,1]){const p=new THREE.Group();p.position.set(0.6*s,1.75,0);const a=mesh(armG,suit);a.position.y=-0.38;p.add(a);
    const hnd=mesh(new THREE.SphereGeometry(0.15,14,10),skin);hnd.position.y=-0.75;p.add(hnd);p.rotation.z=0.18*s;g.add(p);r[s<0?'armL':'armR']=p;}
  const head=new THREE.Group();head.position.y=2.35;g.add(head);r.head=head;
  mesh(new THREE.SphereGeometry(0.5,32,24),skin,{parent:head});
  for(const s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(0.1,16,12),new THREE.MeshBasicMaterial({color:0xffffff}));e.position.set(0.17*s,0.1,0.42);e.scale.z=0.6;head.add(e);
    const p=new THREE.Mesh(new THREE.SphereGeometry(0.055,12,8),new THREE.MeshBasicMaterial({color:0x111111}));p.position.set(0.17*s,0.09,0.5);head.add(p);
    const ear=mesh(new THREE.SphereGeometry(0.12,12,8),skin);ear.position.set(0.5*s,0,0);ear.scale.z=0.6;head.add(ear);}
  const nose=mesh(new THREE.SphereGeometry(0.13,16,12),0xe8a57d);nose.position.set(0,-0.05,0.5);nose.scale.set(1,0.9,1.1);head.add(nose);
  if(mustache!==null)for(const s of[-1,1]){const m=mesh(new THREE.SphereGeometry(0.15,14,10),mustache,{outline:0.06});m.scale.set(1.3,0.5,0.6);m.position.set(0.14*s,-0.2,0.45);m.rotation.z=-0.35*s;head.add(m);}
  const mouth=new THREE.Mesh(new THREE.TorusGeometry(0.1,0.025,6,16,Math.PI),new THREE.MeshBasicMaterial({color:0x5a1d1d}));mouth.rotation.z=Math.PI;mouth.position.set(0,-0.3,0.44);head.add(mouth);
  if(glasses)for(const s of[-1,1]){const gl=new THREE.Mesh(new THREE.TorusGeometry(0.13,0.022,8,24),new THREE.MeshBasicMaterial({color:0x111111}));gl.position.set(0.17*s,0.1,0.5);head.add(gl);}
  if(hair!==null&&!hat){for(const s of[-1,1]){const h=mesh(new THREE.SphereGeometry(0.2,12,10),hair);h.position.set(0.4*s,0.15,-0.1);h.scale.set(0.6,1,1.2);head.add(h);}}
  if(hat){const b=mesh(new THREE.CylinderGeometry(0.85,0.85,0.06,32),hat);b.position.y=0.32;head.add(b);
    const c=mesh(new THREE.CylinderGeometry(0.42,0.48,0.38,32),hat);c.position.y=0.5;head.add(c);
    const band=mesh(new THREE.CylinderGeometry(0.485,0.485,0.1,32),0xb3262e,{outline:0});band.position.y=0.38;head.add(band);}
  blob(0.75,g);
  g.userData=r;return g;
}
function walk(p,t,speed=8,amp=0.6){const r=p.userData;const s=Math.sin(t*speed);r.legL.rotation.x=s*amp;r.legR.rotation.x=-s*amp;r.armL.rotation.x=-s*amp*0.8;r.armR.rotation.x=s*amp*0.8;r.body.position.y=1.3+Math.abs(Math.cos(t*speed))*0.06;r.head.position.y=2.35+Math.abs(Math.cos(t*speed))*0.06;}
function idle(p,t){const r=p.userData;r.legL.rotation.x=r.legR.rotation.x=0;r.armL.rotation.x=r.armR.rotation.x=Math.sin(t*2)*0.05;r.head.position.y=2.35+Math.sin(t*3)*0.02;r.head.rotation.z=Math.sin(t*1.7)*0.05;}

// ---------- props ----------
function coin(){const g=new THREE.CylinderGeometry(0.32,0.32,0.09,32);const c=mesh(g,0xf6c431,{outline:0.06});return c;}
const euroTex=canvasTex(256,128,(x,w,h)=>{x.fillStyle='#7fcf8a';x.fillRect(0,0,w,h);x.strokeStyle='#2f7a3f';x.lineWidth=10;x.strokeRect(8,8,w-16,h-16);x.fillStyle='#2f7a3f';x.font='900 84px Mont';x.textAlign='center';x.textBaseline='middle';x.fillText('€',w/2,h/2+4);});
function bill(){return new THREE.Mesh(new THREE.PlaneGeometry(0.9,0.45),new THREE.MeshBasicMaterial({map:euroTex,side:THREE.DoubleSide}));}
function padlock(){const g=new THREE.Group();const b=mesh(new THREE.BoxGeometry(1.3,1.05,0.45),0xf6c431,{outline:0.05});g.add(b);
  const s=mesh(new THREE.TorusGeometry(0.42,0.11,12,32,Math.PI),0xb9c2cc,{outline:0.08});s.position.y=0.52;g.add(s);
  const k=new THREE.Mesh(new THREE.CircleGeometry(0.12,20),new THREE.MeshBasicMaterial({color:0x3b2a10}));k.position.set(0,0.05,0.235);g.add(k);
  const k2=new THREE.Mesh(new THREE.PlaneGeometry(0.08,0.26),k.material);k2.position.set(0,-0.12,0.235);g.add(k2);return g;}
function moneyBag(){const g=new THREE.Group();const b=mesh(new THREE.SphereGeometry(0.7,24,18),0xc9a56b);b.scale.set(1,0.95,0.9);g.add(b);
  const n=mesh(new THREE.CylinderGeometry(0.2,0.3,0.3,16),0xc9a56b);n.position.y=0.72;g.add(n);
  const tie=mesh(new THREE.TorusGeometry(0.22,0.05,8,20),0x8a5a2b,{outline:0});tie.rotation.x=Math.PI/2;tie.position.y=0.66;g.add(tie);
  const l=label('€',{w:256,h:256,font:'900 200px Mont',color:'#2f7a3f',stroke:null,size:0.7});l.position.set(0,0,0.66);g.add(l);return g;}
function arrowUp(color=0x3cc46a){const g=new THREE.Group();const s=mesh(new THREE.BoxGeometry(0.4,1.6,0.3),color);s.position.y=0.8;g.add(s);
  const h=mesh(new THREE.ConeGeometry(0.6,0.8,4),color);h.position.y=1.95;h.rotation.y=Math.PI/4;g.add(h);return g;}

// ---------- lights ----------
const scene=new THREE.Scene();
const hemi=new THREE.HemisphereLight(0xfff4e0,0x8a6a50,1.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(6,12,9);scene.add(sun);

function skyTex(top,bot){return canvasTex(16,512,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,top);g.addColorStop(1,bot);x.fillStyle=g;x.fillRect(0,0,w,h);});}
const SKY=skyTex('#5fb6ff','#ffe6b8');

// =========== SCENE 1/2: PIAZZA + BANK ===========
const piazza=new THREE.Group();scene.add(piazza);
{
  const tiles=canvasTex(512,512,(x,w,h)=>{x.fillStyle='#e3b98a';x.fillRect(0,0,w,h);x.strokeStyle='#c99b6c';x.lineWidth=6;for(let i=0;i<=8;i++){x.beginPath();x.moveTo(i*64,0);x.lineTo(i*64,h);x.stroke();x.beginPath();x.moveTo(0,i*64);x.lineTo(w,i*64);x.stroke();}});
  tiles.wrapS=tiles.wrapT=THREE.RepeatWrapping;tiles.repeat.set(20,20);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),toon(0xffffff,{map:tiles}));ground.rotation.x=-Math.PI/2;piazza.add(ground);
  // bank
  const bank=new THREE.Group();bank.position.set(0,0,-6);piazza.add(bank);
  const wall=mesh(new THREE.BoxGeometry(11,7,4),0xf3e6cf,{outline:0.01});wall.position.y=3.5;bank.add(wall);
  const steps=mesh(new THREE.BoxGeometry(9,0.4,1.4),0xd9ccb5,{outline:0.02});steps.position.set(0,0.2,2.6);bank.add(steps);
  for(let i=0;i<6;i++){const c=mesh(new THREE.CylinderGeometry(0.32,0.38,5.2,20),0xfffaf0,{outline:0.05});c.position.set(-3.75+i*1.5,3.0,2.4);bank.add(c);}
  const ent=mesh(new THREE.BoxGeometry(10.4,0.7,1.2),0xfffaf0,{outline:0.02});ent.position.set(0,5.9,2.4);bank.add(ent);
  const ped=new THREE.Shape();ped.moveTo(-5.4,0);ped.lineTo(5.4,0);ped.lineTo(0,2.2);ped.lineTo(-5.4,0);
  const pm=mesh(new THREE.ExtrudeGeometry(ped,{depth:1.2,bevelEnabled:false}),0xfffaf0,{outline:0.015});pm.position.set(0,6.25,1.8);bank.add(pm);
  const door=mesh(new THREE.BoxGeometry(2,3.4,0.2),0x6b3d22,{outline:0.03});door.position.set(0,1.7,2.05);bank.add(door);
  const sign=label('BANCA',{w:1024,h:256,font:'900 170px Mont',color:'#1d3b6e',stroke:null,size:1.1});sign.position.set(0,5.9,3.02);bank.add(sign);
  piazza.userData.sign=sign;
  const sign2=label('CREDITO EMILIANO',{w:1600,h:256,font:'900 140px Mont',color:'#1d3b6e',stroke:null,size:0.6});sign2.position.set(0,5.9,3.03);sign2.visible=false;bank.add(sign2);piazza.userData.sign2=sign2;
  // € emblem in pediment
  const em=label('€',{w:256,h:256,font:'900 210px Mont',color:'#f2b632',stroke:'#1b1420',sw:12,size:1.2});em.position.set(0,7.1,3.02);bank.add(em);
  // houses
  const hc=[0xe8935a,0xf2c35b,0xd9694e,0xf0d7a1,0xe07b5a,0xf4b183];
  const R=rng(7);
  for(let i=0;i<8;i++){const side=i<4?-1:1;const k=i%4;const hw=4+R()*1.5,hh=6+R()*4;
    const h=new THREE.Group();h.position.set(side*(9+k*0.3),0,-4+k*-4.5+ (side>0?1:0));h.rotation.y=-side*0.35;piazza.add(h);
    const b=mesh(new THREE.BoxGeometry(hw,hh,4),hc[(i*3)%6],{outline:0.01});b.position.y=hh/2;h.add(b);
    const roof=mesh(new THREE.BoxGeometry(hw+0.6,0.4,4.6),0xb5502f,{outline:0.02});roof.position.y=hh+0.2;h.add(roof);
    for(let fy=0;fy<Math.floor(hh/2.4);fy++)for(let fx=-1;fx<=1;fx+=2){const w=mesh(new THREE.BoxGeometry(0.8,1.2,0.1),0x2f7a4f,{outline:0.04});w.position.set(fx*hw*0.25,2+fy*2.3,2.05);h.add(w);}
  }
  // cypresses
  for(const p of[[-7,-12],[7.5,-13],[-12,-16],[13,-17]]){const c=mesh(new THREE.ConeGeometry(0.9,5,12),0x2f6b3a,{outline:0.04});c.position.set(p[0],2.6,p[1]);c.scale.x=0.8;piazza.add(c);}
  // bunting
  const cols=[0x2f9a4f,0xffffff,0xd8343d];
  for(let i=0;i<18;i++){const f=mesh(new THREE.ConeGeometry(0.28,0.6,3),cols[i%3],{outline:0.06});const x=-7+i*0.82;f.position.set(x,7.6-0.6*Math.sin(Math.PI*i/17),-1.5);f.rotation.x=Math.PI;piazza.add(f);}
}
const farmer=person({suit:0xd8343d,hat:0xe8c779,apron:true,mustache:0x3a2414});scene.add(farmer);
const banker=person({suit:0x22324f,tie:0xd8343d,glasses:true,mustache:null,hair:0xb9b9b9,pants:0x22324f,skin:0xf5cfa8});scene.add(banker);
const wheel1=cheese();scene.add(wheel1);
const lock=padlock();scene.add(lock);

// =========== SCENE 3: SCALE ===========
const scaleScene=new THREE.Group();scene.add(scaleScene);
const coins=[];const kg=label('0 kg',{w:768,h:256,font:'900 150px Mont',color:'#7dff9a',bg:'#13202b',stroke:'#1b1420',sw:12,size:1.2});
const priceLbl=label('€ 500+',{w:768,h:256,font:'900 150px Mont',color:'#1b1420',bg:'#ffd23f',size:1.25});
{
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),toon(0xf6e3c4));floor.rotation.x=-Math.PI/2;scaleScene.add(floor);
  const wall=new THREE.Mesh(new THREE.PlaneGeometry(80,40),toon(0x9fd3e6));wall.position.set(0,10,-6);scaleScene.add(wall);
  const base=mesh(new THREE.BoxGeometry(3.4,0.5,2.6),0x9aa7b5);base.position.y=0.25;scaleScene.add(base);
  const col=mesh(new THREE.CylinderGeometry(0.25,0.25,1.2,16),0x9aa7b5);col.position.y=1.1;scaleScene.add(col);
  const plat=mesh(new THREE.CylinderGeometry(1.5,1.5,0.18,40),0xc7d0d9);plat.position.y=1.75;scaleScene.add(plat);scaleScene.userData.plat=plat;
  const disp=mesh(new THREE.BoxGeometry(2.6,1.0,0.4),0x2b3540);disp.position.set(0,0.5,1.45);scaleScene.add(disp);
  kg.position.set(0,0.52,1.68);kg.scale.setScalar(0.75);scaleScene.add(kg);
  for(let i=0;i<14;i++){const c=coin();const st=i%3;c.position.set(2.2+st*0.75,0.05+Math.floor(i/3)*0.1,0.6+(st%2)*0.3);c.userData.base=c.position.clone();c.userData.i=i;scaleScene.add(c);coins.push(c);}
  priceLbl.position.set(1.2,4.3,0.3);scaleScene.add(priceLbl);
}

// =========== SCENE 4: WAITING + HANDOFF ===========
const waitScene=new THREE.Group();scene.add(waitScene);
const cal=label('',{w:512,h:512,font:'900 150px Mont'});
let calPages=[];const bag=moneyBag();scene.add(bag);
const bills=[];
{
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),toon(0xc99a6b));floor.rotation.x=-Math.PI/2;waitScene.add(floor);
  const wall=new THREE.Mesh(new THREE.PlaneGeometry(80,40),toon(0xf5d9a6));wall.position.set(0,10,-4);waitScene.add(wall);
  // shelf of aging wheels behind
  const shelf=mesh(new THREE.BoxGeometry(7,0.2,1.4),0x8a5a33);shelf.position.set(-2.5,2.6,-3.2);waitScene.add(shelf);

const data=await (await fetch('words.json')).json();
const words=data.words;
const chunks=[];{let cur=[];for(const w of words){cur.push(w);const end=/[.?!:,]$/.test(w.w);if(cur.length>=3||end){chunks.push(cur);cur=[];}}if(cur.length)chunks.push(cur);}
const HL=new Set(['italien','bank','kredit,','käse','witz.','parmesan','sicherheit.','vierzig','kilo','hunderte','euro','jahrelang','sofort','geld.','tresoren.','hunderttausende','gewendet.','verkauft','käse.','mehr','fakten.']);
await document.fonts.load('900 80px Mont');
function drawCaptions(t){
  let ci=-1;for(let i=0;i<chunks.length;i++){if(t>=chunks[i][0].s-0.05)ci=i;}
  if(ci<0)return;const ch=chunks[ci];const next=chunks[ci+1];
  if(t>ch[ch.length-1].e+0.6&&(!next||t<next[0].s-0.05))return;
  const age=t-ch[0].s;const sc=0.85+0.15*eob(age/0.18);
  octx.save();octx.translate(W/2,H*0.735);octx.scale(sc,sc);
  octx.font='900 84px Mont';octx.textBaseline='middle';octx.lineJoin='round';
  const parts=ch.map(w=>w.w.toUpperCase());const sp=24;
  const ws=parts.map(p=>octx.measureText(p).width);let total=ws.reduce((a,b)=>a+b,0)+sp*(parts.length-1);
  let lines=[[0,parts.length]];if(total>W*0.86&&parts.length>1){lines=[[0,parts.length-1],[parts.length-1,parts.length]];}
  lines.forEach(([a,b],li)=>{let lw=0;for(let i=a;i<b;i++)lw+=ws[i]+(i>a?sp:0);let x=-lw/2;const y=(li-(lines.length-1)/2)*100;
    for(let i=a;i<b;i++){const w=ch[i];const active=t>=w.s-0.03;const hl=HL.has(w.w.toLowerCase());
      octx.globalAlpha=active?1:0.55;
      octx.lineWidth=16;octx.strokeStyle='rgba(10,8,20,0.9)';octx.strokeText(parts[i],x,y);
      octx.fillStyle=hl&&active?'#ffc93c':'#ffffff';octx.fillText(parts[i],x,y);x+=ws[i]+sp;}});
  octx.restore();
}
window.renderAt=(t)=>{update(t);renderer.render(scene,camera);
  octx.drawImage(renderer.domElement,0,0);
  // vignette
  const g=octx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.28)');octx.fillStyle=g;octx.fillRect(0,0,W,H);
  drawCaptions(t);
